services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: workerly
      POSTGRES_PASSWORD: workerly
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workerly"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports: ["6380:6379"]
    volumes: [redisdata:/data]

  # --- Local production-like stack: the real images, production builds, plain http on localhost.
  # docker compose --profile app up --build   (API :3100, customer :3101, worker :3102, admin :3103)
  # Runs as DEPLOY_ENV=staging, so fake SMS/payments are allowed: read login codes with
  #   docker compose logs -f jobs | grep FakeSms
  migrate:
    profiles: [app]
    build: ./backend
    image: workerly-api:local
    command: bin/rails db:prepare
    env_file: ./backend/.env.app-local
    depends_on: { db: { condition: service_healthy } }
  api:
    profiles: [app]
    image: workerly-api:local
    env_file: ./backend/.env.app-local
    ports: ["3100:3000"]
    volumes: [appstorage:/rails/storage]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }
  jobs:
    profiles: [app]
    image: workerly-api:local
    command: bundle exec sidekiq -C config/sidekiq.yml
    env_file: ./backend/.env.app-local
    volumes: [appstorage:/rails/storage]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }
  customer: &web
    profiles: [app]
    build: ./frontend
    image: workerly-web:local
    environment: &webenv
      APP_TARGET: customer
      NUXT_PUBLIC_API_BASE: http://localhost:3100/api/v1
      NUXT_PUBLIC_APP_URLS_CUSTOMER: http://localhost:3101
      NUXT_PUBLIC_APP_URLS_WORKER: http://localhost:3102
      NUXT_PUBLIC_APP_URLS_ADMIN: http://localhost:3103
    ports: ["3101:3000"]
    depends_on: [api]
  worker:
    <<: *web
    environment: { <<: *webenv, APP_TARGET: worker }
    ports: ["3102:3000"]
  admin:
    <<: *web
    environment: { <<: *webenv, APP_TARGET: admin }
    ports: ["3103:3000"]

volumes:
  pgdata:
  redisdata:
  appstorage:
