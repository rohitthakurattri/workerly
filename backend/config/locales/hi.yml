hi:
  errors:
    unauthorized: "जारी रखने के लिए कृपया लॉग इन करें।"
    invalid_phone: "कृपया सही 10 अंकों का भारतीय मोबाइल नंबर डालें।"
    otp_incorrect: "यह कोड गलत है।"
