# Labelled triage cases: realistic customer wording (English, Hindi, Punjabi, romanised mixes)
# and the category a dispatcher would pick. Run: bin/rails "ai:eval[triage]".
# Grow it from real traffic with bin/rails "ai:export_triage_cases" (redacted), reviewing each label.
# `null` means no listed category fits: the model should return no category.
version: 2026-11-07.1
