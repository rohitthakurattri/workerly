default: &default
  adapter: postgis
  encoding: unicode
  schema_search_path: public
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5433) %>
  username: <%= ENV.fetch("DB_USER", "workerly") %>
  password: <%= ENV.fetch("DB_PASSWORD", "workerly") %>

development:
  <<: *default
  database: workerly_development

test:
  <<: *default
  database: workerly_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
