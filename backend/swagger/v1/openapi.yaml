      - name: Authorization
        in: header
        schema:
          type: string
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: ok
  "/api/v1/admin/workers/{id}/verification":
    post:
      summary: Decide on a submitted worker
      tags:
      - Admin
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: approved
        '422':
          description: documents still pending
      requestBody:
        content:
