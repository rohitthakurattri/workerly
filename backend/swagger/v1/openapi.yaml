---
openapi: 3.0.3
info:
  title: Workerly API
  version: v1
servers:
- url: http://localhost:3000
- url: https://api.workerly.in
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
            request_id:
              type: string
    user:
      type: object
      required:
      - id
      - phone
      - roles
      - locale
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        locale:
          type: string
          enum:
          - en
          - hi
          - pa
        roles:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
    file:
      type: object
      nullable: true
      properties:
        url:
          type: string
        content_type:
          type: string
        byte_size:
          type: integer
        filename:
          type: string
        expires_in:
          type: integer
    category:
      type: object
      required:
      - slug
      - name
      - children
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        inspection_allowed:
          type: boolean
        children:
          type: array
          items:
            "$ref": "#/components/schemas/category"
    city:
      type: object
      required:
      - slug
      - name
      - center
      properties:
        slug:
          type: string
        name:
          type: string
        state:
          type: string
        currency_code:
          type: string
        time_zone:
          type: string
        service_radius_m:
          type: integer
        center:
          "$ref": "#/components/schemas/lat_lng"
    lat_lng:
      type: object
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
        lng:
          type: number
    service_area:
      type: object
      required:
      - id
      - city
      - center
      - radius_m
      properties:
        id:
          type: string
        city:
          type: string
        label:
          type: string
          nullable: true
        radius_m:
          type: integer
        center:
          "$ref": "#/components/schemas/lat_lng"
    worker_document:
      type: object
      required:
      - id
      - kind
      - doc_type
      - status
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - identity
          - address
          - trade
        doc_type:
          type: string
        number_last4:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - superseded
        rejection_reason:
          type: string
          nullable: true
        reviewed_at:
          type: string
          nullable: true
        uploaded_at:
          type: string
        file:
          "$ref": "#/components/schemas/file"
    verification_status:
      type: string
      enum:
      - draft
      - pending_review
      - changes_requested
      - approved
      - rejected
    worker_profile:
      type: object
      required:
      - id
      - verification_status
      - editable
      - suspended
      - skills
      - service_areas
      - documents
      - missing
      properties:
        id:
          type: string
        bio:
          type: string
          nullable: true
        experience_years:
          type: integer
          nullable: true
        verification_status:
          "$ref": "#/components/schemas/verification_status"
        available:
          type: boolean
        editable:
          type: boolean
        suspended:
          type: boolean
        rating_avg:
          type: number
          nullable: true
        rating_count:
          type: integer
        submitted_at:
          type: string
          nullable: true
        approved_at:
          type: string
          nullable: true
        photo:
          "$ref": "#/components/schemas/file"
        skills:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              name:
                type: string
              experience_years:
                type: integer
                nullable: true
        service_areas:
          type: array
          items:
            "$ref": "#/components/schemas/service_area"
        documents:
          type: array
          items:
            "$ref": "#/components/schemas/worker_document"
        missing:
          type: array
          items:
            type: string
        last_decision:
          type: object
          nullable: true
          properties:
            decision:
              type: string
            reason:
              type: string
              nullable: true
            decided_at:
              type: string
    admin_worker_summary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        phone:
          type: string
        verification_status:
          "$ref": "#/components/schemas/verification_status"
        experience_years:
          type: integer
          nullable: true
        suspended:
          type: boolean
        skills:
          type: array
          items:
            type: string
        submitted_at:
          type: string
          nullable: true
        created_at:
          type: string
    admin_worker_detail:
      type: object
      properties:
        id:
          type: string
        bio:
          type: string
          nullable: true
        experience_years:
          type: integer
          nullable: true
        verification_status:
          "$ref": "#/components/schemas/verification_status"
        suspended:
          type: boolean
        suspension_reason:
          type: string
          nullable: true
        submitted_at:
          type: string
          nullable: true
        approved_at:
          type: string
          nullable: true
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
            phone:
              type: string
            created_at:
              type: string
        photo:
          "$ref": "#/components/schemas/file"
        skills:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              name:
                type: string
              experience_years:
                type: integer
                nullable: true
        service_areas:
          type: array
          items:
            "$ref": "#/components/schemas/service_area"
        documents:
          type: array
          items:
            "$ref": "#/components/schemas/worker_document"
        missing:
          type: array
          items:
            type: string
        history:
          type: array
          items:
            type: object
            properties:
              decision:
                type: string
              reason:
                type: string
                nullable: true
              documents:
                type: array
                items:
                  type: object
              by:
                type: string
              at:
                type: string
    category_brief:
      type: object
      required:
      - slug
      - name
      properties:
        slug:
          type: string
        name:
          type: string
        icon:
          type: string
          nullable: true
    address:
      type: object
      required:
      - id
      - line1
      - locality
      - pincode
      - city
      - location
      - is_default
      properties:
        id:
          type: string
        label:
          type: string
          nullable: true
        line1:
          type: string
        line2:
          type: string
          nullable: true
        landmark:
          type: string
          nullable: true
        locality:
          type: string
        pincode:
          type: string
        city:
          type: string
        is_default:
          type: boolean
        location:
          "$ref": "#/components/schemas/lat_lng"
    request_status:
      type: string
      enum:
      - draft
      - open
      - quoting
      - booked
      - fulfilled
      - expired
      - cancelled
    urgency:
      type: string
      enum:
      - asap
      - today
      - this_week
      - flexible
    request_photo:
      type: object
      required:
      - id
      - kind
      - file
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - image
          - audio
          - video
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        file:
          "$ref": "#/components/schemas/file"
    voice_note:
      type: object
      required:
      - id
      - transcript_status
      - created_at
      properties:
        id:
          type: string
        duration_ms:
          type: integer
          nullable: true
        transcript_status:
          type: string
          enum:
          - pending
          - succeeded
          - failed
          - skipped
          nullable: true
        transcript_language:
          type: string
          nullable: true
        transcript:
          type: string
          nullable: true
        file:
          allOf:
          - "$ref": "#/components/schemas/file"
          nullable: true
        created_at:
          type: string
    ai_quality:
      type: object
      required:
      - from
      - to
      - submitted
      - triaged
      - preselected
      - no_suggestion
      - calibration
      - categories
      - confusions
      - versions
      - voice_notes
      properties:
        from:
          type: string
        to:
          type: string
        submitted:
          type: integer
        triaged:
          type: integer
        coverage:
          type: number
          nullable: true
        accuracy:
          type: number
          nullable: true
        no_suggestion:
          type: integer
        preselected:
          type: object
          required:
          - count
          properties:
            count:
              type: integer
            share:
              type: number
              nullable: true
            accuracy:
              type: number
              nullable: true
        calibration:
          type: array
          items:
            type: object
            required:
            - from
            - to
            - count
            properties:
              from:
                type: number
              to:
                type: number
              count:
                type: integer
              accuracy:
                type: number
                nullable: true
        categories:
          type: array
          items:
            type: object
            required:
            - slug
            - requests
            - suggested
            properties:
              slug:
                type: string
              requests:
                type: integer
              suggested:
                type: integer
              recall:
                type: number
                nullable: true
              precision:
                type: number
                nullable: true
        confusions:
          type: array
          items:
            type: object
            required:
            - suggested
            - chosen
            - count
            properties:
              suggested:
                type: string
              chosen:
                type: string
              count:
                type: integer
        versions:
          type: array
          items:
            type: object
            required:
            - triaged
            properties:
              prompt_version:
                type: string
                nullable: true
              model:
                type: string
                nullable: true
              triaged:
                type: integer
              accuracy:
                type: number
                nullable: true
        voice_notes:
          type: object
          required:
          - count
          - transcribed
          - failed
          - skipped
          properties:
            count:
              type: integer
            transcribed:
              type: integer
            failed:
              type: integer
            skipped:
              type: integer
    triage:
      type: object
      required:
      - id
      - confidence
      - alternatives
      - questions
      - safety_flag
      - needs_confirmation
      properties:
        id:
          type: string
        suggested_category:
          allOf:
          - "$ref": "#/components/schemas/category_brief"
          nullable: true
        confidence:
          type: number
        summary:
          type: string
          nullable: true
        questions:
          type: array
          items:
            type: string
        urgency:
          allOf:
          - "$ref": "#/components/schemas/urgency"
          nullable: true
        safety_flag:
          type: boolean
        needs_confirmation:
          type: boolean
        alternatives:
          type: array
          items:
            "$ref": "#/components/schemas/category_brief"
    service_request:
      type: object
      required:
      - id
      - status
      - answers
      - safety_flag
      - urgency
      - photos
      - missing
      - cancellable
      - invited_count
      - quotes_count
      - created_at
      properties:
        id:
          type: string
        status:
          "$ref": "#/components/schemas/request_status"
        description:
          type: string
          nullable: true
        answers:
          type: array
          items:
            type: object
            required:
            - question
            - answer
            properties:
              question:
                type: string
              answer:
                type: string
        ai_summary:
          type: string
          nullable: true
        safety_flag:
          type: boolean
        urgency:
          "$ref": "#/components/schemas/urgency"
        category_source:
          type: string
          enum:
          - ai
          - customer
          nullable: true
        category:
          allOf:
          - "$ref": "#/components/schemas/category_brief"
          nullable: true
        address:
          allOf:
          - "$ref": "#/components/schemas/address"
          nullable: true
        preferred_from:
          type: string
          nullable: true
        preferred_to:
          type: string
          nullable: true
        photos:
          type: array
          items:
            "$ref": "#/components/schemas/request_photo"
        voice_note:
          allOf:
          - "$ref": "#/components/schemas/voice_note"
          nullable: true
        triage:
          allOf:
          - "$ref": "#/components/schemas/triage"
          nullable: true
        missing:
          type: array
          items:
            type: string
            enum:
            - description
            - category
            - address
        cancellable:
          type: boolean
        cancel_reason:
          type: string
          nullable: true
        invited_count:
          type: integer
        matched_at:
          type: string
          nullable: true
        quotes_count:
          type: integer
        booking_id:
          type: string
          nullable: true
        created_at:
          type: string
        submitted_at:
          type: string
          nullable: true
        expires_at:
          type: string
          nullable: true
        cancelled_at:
          type: string
          nullable: true
    service_request_summary:
      type: object
      required:
      - id
      - status
      - urgency
      - photo_count
      - created_at
      properties:
        id:
          type: string
        status:
          "$ref": "#/components/schemas/request_status"
        urgency:
          "$ref": "#/components/schemas/urgency"
        title:
          type: string
          nullable: true
        category:
          allOf:
          - "$ref": "#/components/schemas/category_brief"
          nullable: true
        locality:
          type: string
          nullable: true
        photo_count:
          type: integer
        cover:
          "$ref": "#/components/schemas/file"
        created_at:
          type: string
        submitted_at:
          type: string
          nullable: true
        expires_at:
          type: string
          nullable: true
    lead:
      type: object
      required:
      - id
      - status
      - category
      - description
      - answers
      - urgency
      - safety_flag
      - locality
      - city
      - distance_band
      - photos
      - invited_at
      - expires_at
      - currency
      - quotes_count
      - quotes_full
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - new
          - viewed
          - quoted
          - declined
        category:
          type: object
          required:
          - slug
          - name
          - inspection_allowed
          - tax_rate_bps
          properties:
            slug:
              type: string
            name:
              type: string
            icon:
              type: string
              nullable: true
            inspection_allowed:
              type: boolean
            tax_rate_bps:
              type: integer
        currency:
          type: string
        quotes_count:
          type: integer
        quotes_full:
          type: boolean
        quotation:
          allOf:
          - "$ref": "#/components/schemas/worker_quotation"
          nullable: true
        description:
          type: string
          nullable: true
        ai_summary:
          type: string
          nullable: true
        answers:
          type: array
          items:
            type: object
            required:
            - question
            - answer
            properties:
              question:
                type: string
              answer:
                type: string
        urgency:
          "$ref": "#/components/schemas/urgency"
        safety_flag:
          type: boolean
        preferred_from:
          type: string
          nullable: true
        preferred_to:
          type: string
          nullable: true
        locality:
          type: string
        city:
          type: string
        distance_band:
          type: string
          enum:
          - under_1km
          - 1_3km
          - 3_5km
          - 5_10km
          - over_10km
        photos:
          type: array
          items:
            "$ref": "#/components/schemas/request_photo"
        voice_note:
          allOf:
          - "$ref": "#/components/schemas/voice_note"
          nullable: true
        invited_at:
          type: string
        expires_at:
          type: string
    money:
      type: object
      required:
      - minor
      - currency
      properties:
        minor:
          type: integer
        currency:
          type: string
    quotation_kind:
      type: string
      enum:
      - fixed
      - inspection
    quotation_status:
      type: string
      enum:
      - submitted
      - accepted
      - declined
      - withdrawn
      - expired
    quotation_item:
      type: object
      required:
      - type
      - description
      - quantity
      - unit
      - unit_price
      - amount
      properties:
        type:
          type: string
          enum:
          - labour
          - material
          - transport
          - inspection
          - other
        description:
          type: string
        brand:
          type: string
          nullable: true
        quantity:
          type: number
        unit:
          type: string
          enum:
          - job
          - item
          - hour
          - visit
          - metre
          - sq_ft
          - kg
          - litre
        unit_price:
          "$ref": "#/components/schemas/money"
        amount:
          "$ref": "#/components/schemas/money"
        condition:
          type: string
          nullable: true
          enum:
          - new
          - refurbished
          - used
          -
        warranty_days:
          type: integer
          nullable: true
    quotation_revision:
      type: object
      required:
      - id
      - version
      - stage
      - subtotal
      - tax_rate_bps
      - tax
      - total
      - items
      - created_at
      properties:
        id:
          type: string
        version:
          type: integer
        stage:
          type: string
          enum:
          - initial
          - inspection_fee
          - final
          - change_order
        subtotal:
          "$ref": "#/components/schemas/money"
        tax_rate_bps:
          type: integer
        tax:
          "$ref": "#/components/schemas/money"
        total:
          "$ref": "#/components/schemas/money"
        notes:
          type: string
          nullable: true
        estimated_minutes:
          type: integer
          nullable: true
        items:
          type: array
          items:
            "$ref": "#/components/schemas/quotation_item"
        created_at:
          type: string
    quotation_input:
      type: object
      required:
      - kind
      properties:
        kind:
          "$ref": "#/components/schemas/quotation_kind"
        items:
          type: array
          items:
            type: object
            required:
            - type
            - description
            - quantity
            - unit
            - unit_price_minor
            properties:
              type:
                type: string
              description:
                type: string
              brand:
                type: string
              quantity:
                type: number
              unit:
                type: string
              unit_price_minor:
                type: integer
              condition:
                type: string
              warranty_days:
                type: integer
        inspection_fee_minor:
          type: integer
        notes:
          type: string
        estimated_minutes:
          type: integer
        valid_until:
          type: string
    worker_card:
      type: object
      required:
      - id
      - name
      - rating_count
      - verified
      - jobs_done
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        photo:
          "$ref": "#/components/schemas/file"
        rating_avg:
          type: number
          nullable: true
        rating_count:
          type: integer
        experience_years:
          type: integer
          nullable: true
        verified:
          type: boolean
        jobs_done:
          type: integer
        phone:
          type: string
    quotation:
      type: object
      required:
      - id
      - kind
      - status
      - current_version
      - valid_until
      - submitted_at
      - revised
      - revision
      - worker
      - distance_band
      properties:
        id:
          type: string
        kind:
          "$ref": "#/components/schemas/quotation_kind"
        status:
          "$ref": "#/components/schemas/quotation_status"
        current_version:
          type: integer
        valid_until:
          type: string
        submitted_at:
          type: string
        revised:
          type: boolean
        revision:
          "$ref": "#/components/schemas/quotation_revision"
        worker:
          "$ref": "#/components/schemas/worker_card"
        distance_band:
          type: string
          enum:
          - under_1km
          - 1_3km
          - 3_5km
          - 5_10km
          - over_10km
        booking_id:
          type: string
          nullable: true
        decline_reason:
          type: string
          nullable: true
        revisions:
          type: array
          items:
            type: object
            required:
            - version
            - total
            - created_at
            properties:
              version:
                type: integer
              total:
                "$ref": "#/components/schemas/money"
              created_at:
                type: string
    worker_quotation:
      type: object
      required:
      - id
      - lead_id
      - kind
      - status
      - current_version
      - valid_until
      - submitted_at
      - revision
      - category
      - locality
      - editable
      properties:
        id:
          type: string
        lead_id:
          type: string
        kind:
          "$ref": "#/components/schemas/quotation_kind"
        status:
          "$ref": "#/components/schemas/quotation_status"
        current_version:
          type: integer
        valid_until:
          type: string
        submitted_at:
          type: string
        revision:
          "$ref": "#/components/schemas/quotation_revision"
        category:
          "$ref": "#/components/schemas/category_brief"
        locality:
          type: string
        editable:
          type: boolean
        booking_id:
          type: string
          nullable: true
        decline_reason:
          type: string
          nullable: true
    booking_status:
      type: string
      enum:
      - confirmed
      - inspection_scheduled
      - inspecting
      - awaiting_final_approval
      - closed_after_inspection
      - scheduled
      - in_progress
      - awaiting_change_approval
      - completed
      - paid
      - cancelled
      - rejected
      - disputed
      - refunded
    booking_address:
      type: object
      nullable: true
      properties:
        label:
          type: string
          nullable: true
        line1:
          type: string
        line2:
          type: string
          nullable: true
        landmark:
          type: string
          nullable: true
        locality:
          type: string
        pincode:
          type: string
        city:
          type: string
        location:
          "$ref": "#/components/schemas/lat_lng"
    booking_event:
      type: string
      enum:
      - schedule
      - check_in
      - final_quotation
      - approve_final
      - reject_final
      - start
      - change_order
      - approve_change
      - reject_change
      - complete
      - cancel
      - admin_cancel
      - dispute
      - pay
      - refund
      - resolve_dispute
    booking:
      type: object
      required:
      - id
      - status
