---
openapi: 3.0.3
info:
  title: Workerly API
  version: v1
servers:
- url: http://localhost:3000
- url: https://api.workerly.in
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
            request_id:
              type: string
    user:
      type: object
      required:
      - id
      - phone
      - roles
      - locale
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        locale:
          type: string
          enum:
          - en
          - hi
          - pa
        roles:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
    file:
      type: object
      nullable: true
      properties:
        url:
          type: string
        content_type:
          type: string
        byte_size:
          type: integer
        filename:
          type: string
        expires_in:
          type: integer
    category:
      type: object
      required:
      - slug
      - name
      - children
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        inspection_allowed:
          type: boolean
        children:
          type: array
          items:
            "$ref": "#/components/schemas/category"
    city:
      type: object
      required:
      - slug
      - name
      - center
      properties:
        slug:
          type: string
        name:
          type: string
        state:
          type: string
        currency_code:
          type: string
        time_zone:
          type: string
        service_radius_m:
          type: integer
        center:
          "$ref": "#/components/schemas/lat_lng"
    lat_lng:
      type: object
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
        lng:
          type: number
    service_area:
      type: object
      required:
      - id
      - city
      - center
      - radius_m
      properties:
        id:
          type: string
        city:
          type: string
        label:
          type: string
          nullable: true
        radius_m:
          type: integer
        center:
          "$ref": "#/components/schemas/lat_lng"
    worker_document:
      type: object
      required:
      - id
      - kind
      - doc_type
      - status
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - identity
          - address
          - trade
        doc_type:
          type: string
        number_last4:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - superseded
        rejection_reason:
          type: string
          nullable: true
        reviewed_at:
          type: string
          nullable: true
        uploaded_at:
          type: string
        file:
          "$ref": "#/components/schemas/file"
    verification_status:
      type: string
      enum:
      - draft
      - pending_review
      - changes_requested
      - approved
      - rejected
    worker_profile:
      type: object
      required:
      - id
      - verification_status
      - editable
      - suspended
      - skills
      - service_areas
      - documents
      - missing
      properties:
        id:
          type: string
        bio:
          type: string
          nullable: true
        experience_years:
          type: integer
          nullable: true
        verification_status:
          "$ref": "#/components/schemas/verification_status"
        available:
          type: boolean
        editable:
          type: boolean
        suspended:
          type: boolean
        rating_avg:
          type: number
          nullable: true
        rating_count:
          type: integer
        submitted_at:
          type: string
          nullable: true
        approved_at:
          type: string
          nullable: true
        photo:
          "$ref": "#/components/schemas/file"
        skills:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              name:
                type: string
              experience_years:
                type: integer
                nullable: true
        service_areas:
          type: array
          items:
            "$ref": "#/components/schemas/service_area"
        documents:
          type: array
          items:
            "$ref": "#/components/schemas/worker_document"
        missing:
          type: array
          items:
            type: string
        last_decision:
          type: object
          nullable: true
          properties:
            decision:
              type: string
            reason:
              type: string
              nullable: true
            decided_at:
              type: string
    admin_worker_summary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        phone:
          type: string
        verification_status:
          "$ref": "#/components/schemas/verification_status"
        experience_years:
          type: integer
          nullable: true
        suspended:
          type: boolean
        skills:
          type: array
          items:
            type: string
        submitted_at:
          type: string
          nullable: true
        created_at:
          type: string
    admin_worker_detail:
      type: object
      properties:
        id:
          type: string
        bio:
          type: string
          nullable: true
        experience_years:
          type: integer
          nullable: true
        verification_status:
          "$ref": "#/components/schemas/verification_status"
        suspended:
          type: boolean
        suspension_reason:
          type: string
          nullable: true
        submitted_at:
          type: string
          nullable: true
        approved_at:
          type: string
          nullable: true
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
            phone:
              type: string
            created_at:
              type: string
        photo:
          "$ref": "#/components/schemas/file"
        skills:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              name:
                type: string
              experience_years:
                type: integer
                nullable: true
        service_areas:
          type: array
          items:
            "$ref": "#/components/schemas/service_area"
        documents:
          type: array
          items:
            "$ref": "#/components/schemas/worker_document"
        missing:
          type: array
          items:
            type: string
        history:
          type: array
          items:
            type: object
            properties:
              decision:
                type: string
              reason:
                type: string
                nullable: true
              documents:
                type: array
                items:
                  type: object
              by:
                type: string
              at:
                type: string
    category_brief:
      type: object
      required:
      - slug
      - name
      properties:
        slug:
          type: string
        name:
          type: string
        icon:
          type: string
          nullable: true
    address:
      type: object
      required:
      - id
      - line1
      - locality
      - pincode
      - city
      - location
      - is_default
      properties:
        id:
          type: string
        label:
          type: string
          nullable: true
        line1:
          type: string
        line2:
          type: string
          nullable: true
        landmark:
          type: string
          nullable: true
        locality:
          type: string
        pincode:
          type: string
        city:
          type: string
        is_default:
          type: boolean
        location:
          "$ref": "#/components/schemas/lat_lng"
    request_status:
      type: string
      enum:
      - draft
      - open
      - quoting
      - booked
      - fulfilled
      - expired
      - cancelled
    urgency:
      type: string
      enum:
      - asap
      - today
      - this_week
      - flexible
    request_photo:
      type: object
      required:
      - id
      - kind
      - file
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - image
          - audio
          - video
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        file:
          "$ref": "#/components/schemas/file"
    triage:
      type: object
      required:
      - id
      - confidence
      - alternatives
      - questions
      - safety_flag
      - needs_confirmation
      properties:
        id:
          type: string
        suggested_category:
          allOf:
          - "$ref": "#/components/schemas/category_brief"
          nullable: true
        confidence:
          type: number
        summary:
          type: string
          nullable: true
        questions:
          type: array
          items:
            type: string
        urgency:
          allOf:
          - "$ref": "#/components/schemas/urgency"
          nullable: true
        safety_flag:
          type: boolean
        needs_confirmation:
          type: boolean
        alternatives:
          type: array
          items:
            "$ref": "#/components/schemas/category_brief"
    service_request:
      type: object
      required:
      - id
      - status
      - answers
      - safety_flag
      - urgency
      - photos
      - missing
      - cancellable
      - created_at
      properties:
        id:
          type: string
        status:
          "$ref": "#/components/schemas/request_status"
        description:
          type: string
          nullable: true
        answers:
          type: array
          items:
            type: object
            required:
            - question
            - answer
            properties:
              question:
                type: string
              answer:
                type: string
        ai_summary:
          type: string
          nullable: true
        safety_flag:
          type: boolean
        urgency:
          "$ref": "#/components/schemas/urgency"
        category_source:
          type: string
          enum:
          - ai
          - customer
          nullable: true
        category:
          allOf:
          - "$ref": "#/components/schemas/category_brief"
          nullable: true
        address:
          allOf:
          - "$ref": "#/components/schemas/address"
          nullable: true
        preferred_from:
          type: string
          nullable: true
        preferred_to:
          type: string
          nullable: true
        photos:
          type: array
          items:
            "$ref": "#/components/schemas/request_photo"
        triage:
          allOf:
          - "$ref": "#/components/schemas/triage"
          nullable: true
        missing:
          type: array
          items:
            type: string
            enum:
            - description
            - category
            - address
        cancellable:
          type: boolean
        cancel_reason:
          type: string
          nullable: true
        created_at:
          type: string
        submitted_at:
          type: string
          nullable: true
        expires_at:
          type: string
          nullable: true
        cancelled_at:
          type: string
          nullable: true
    service_request_summary:
      type: object
      required:
      - id
      - status
      - urgency
      - photo_count
      - created_at
      properties:
        id:
          type: string
        status:
          "$ref": "#/components/schemas/request_status"
        urgency:
          "$ref": "#/components/schemas/urgency"
        title:
          type: string
          nullable: true
        category:
          allOf:
          - "$ref": "#/components/schemas/category_brief"
          nullable: true
        locality:
          type: string
          nullable: true
        photo_count:
          type: integer
        cover:
          "$ref": "#/components/schemas/file"
        created_at:
          type: string
        submitted_at:
          type: string
          nullable: true
        expires_at:
          type: string
          nullable: true
    page_meta:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
    auth_session:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - access_token
          - token_type
          - expires_in
          - active_role
          - session
          - user
          properties:
            access_token:
              type: string
            token_type:
              type: string
            expires_in:
              type: integer
            refresh_token:
              type: string
            active_role:
              type: string
            session:
              type: object
              properties:
                scope:
                  type: string
                expires_at:
                  type: string
            user:
              "$ref": "#/components/schemas/user"
paths:
  "/api/v1/auth/otp":
    post:
      summary: Send a login code by SMS
      tags:
      - Auth
      parameters: []
      responses:
        '202':
          description: code sent
        '422':
          description: invalid phone
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              properties:
                phone:
                  type: string
                  example: '9876543210'
  "/api/v1/auth/otp/verify":
    post:
      summary: Verify a login code
      tags:
      - Auth
      description: scope=consumer (default) returns a session and sets the HttpOnly
        `wk_rt` cookie. scope=staff returns an MFA token for /auth/totp.
      parameters: []
      responses:
        '201':
          description: logged in
        '200':
          description: 'staff: TOTP required'
        '422':
          description: wrong code
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - code
              properties:
                phone:
                  type: string
                code:
                  type: string
                scope:
                  type: string
                  enum:
                  - consumer
                  - staff
                role:
                  type: string
                  enum:
                  - customer
                  - worker
                token_delivery:
                  type: string
                  enum:
                  - cookie
                  - body
  "/api/v1/auth/totp":
    post:
      summary: Staff second factor
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: staff session started
        '401':
          description: wrong code
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - mfa_token
              - code
              properties:
                mfa_token:
                  type: string
                code:
                  type: string
                role:
                  type: string
  "/api/v1/auth/refresh":
    post:
      summary: Rotate the refresh token and get a new access token
      tags:
      - Auth
      description: Reads the refresh cookie for the given scope (or `refresh_token`
        with token_delivery=body). Reusing a rotated token revokes the session.
      parameters:
      - name: Origin
        in: header
        schema:
          type: string
      responses:
        '200':
          description: rotated
        '401':
          description: invalid token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                role:
                  type: string
                token_delivery:
                  type: string
                refresh_token:
                  type: string
  "/api/v1/auth/switch_role":
    post:
      summary: Act as another role in the same session
      tags:
      - Auth
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: switched
        '403':
          description: role not held
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - role
              properties:
                role:
                  type: string
  "/api/v1/auth/session":
    delete:
      summary: Log out (revokes the session and all its refresh tokens)
      tags:
      - Auth
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '204':
          description: logged out
  "/api/v1/me":
    get:
      summary: Current user
      tags:
      - Me
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: ok
        '401':
          description: not logged in
    patch:
      summary: Update name, email or language
      tags:
      - Me
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: updated
        '422':
          description: invalid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    name:
                      type: string
                    email:
                      type: string
                    locale:
                      type: string
  "/api/v1/customer/addresses":
    get:
      summary: Saved addresses (default first)
      tags:
      - Customer addresses
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: ok
    post:
      summary: Add an address (the city is derived from the pin)
      tags:
      - Customer addresses
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: created
        '422':
          description: pin outside the launched cities
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - line1
              - locality
              - pincode
              - lat
              - lng
              properties:
                label:
                  type: string
                line1:
                  type: string
                line2:
                  type: string
                landmark:
                  type: string
                locality:
                  type: string
                pincode:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
                is_default:
                  type: boolean
  "/api/v1/customer/addresses/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      required: true
    patch:
      summary: Edit an address (submitted requests keep their copy)
      tags:
      - Customer addresses
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
    delete:
      summary: Remove an address (soft delete)
      tags:
      - Customer addresses
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '204':
          description: removed
  "/api/v1/customer/service_requests":
    get:
      summary: Own requests, newest first
      tags:
      - Customer requests
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: filter[status]
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - draft
          - past
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ok
    post:
      summary: Start a draft
      tags:
      - Customer requests
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: draft created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
  "/api/v1/customer/service_requests/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      required: true
    get:
      summary: One request
      tags:
      - Customer requests
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: ok
        '404':
          description: someone else's request
    patch:
      summary: Edit a draft
      tags:
      - Customer requests
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: updated
        '403':
          description: already submitted
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                category:
                  type: string
                address:
                  type: string
                urgency:
                  "$ref": "#/components/schemas/urgency"
                preferred_from:
                  type: string
                  format: date-time
                preferred_to:
                  type: string
                  format: date-time
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      question:
                        type: string
                      answer:
                        type: string
    delete:
      summary: Discard a draft
      tags:
      - Customer requests
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '204':
          description: discarded
  "/api/v1/customer/service_requests/{id}/submit":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      required: true
    post:
      summary: Submit a draft (draft -> open)
      tags:
      - Customer requests
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: submitted
        '422':
          description: incomplete
  "/api/v1/customer/service_requests/{id}/cancel":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      required: true
    post:
      summary: Cancel an open request
      tags:
      - Customer requests
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: cancelled
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
  "/api/v1/customer/service_requests/{id}/attachments":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      required: true
    post:
      summary: Add a photo (re-encoded to JPEG, EXIF and GPS removed, max 2048 px)
      tags:
      - Customer requests
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: added
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: string
              format: binary
  "/api/v1/customer/service_requests/{id}/triage":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      required: true
    post:
      summary: 'AI suggestion: category, summary, follow-up questions (behind AI_TRIAGE_ENABLED)'
      tags:
      - Customer requests
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '200':
          description: suggestion
        '503':
          description: 'AI off or failing: the customer picks the category'
  "/api/v1/categories":
    get:
      summary: Active service categories (tree)
      tags:
      - Catalog
      responses:
        '200':
          description: ok
  "/api/v1/cities":
    get:
      summary: Launched cities
      tags:
      - Catalog
      responses:
        '200':
          description: ok
  "/api/v1/worker/registration":
    post:
      summary: Become a worker (customer -> worker)
      tags:
      - Worker onboarding
      security:
      - bearer: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      responses:
        '201':
          description: registered; returns a worker-role access token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
